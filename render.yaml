services:
  - type: web
    runtime: static
    name: mimos-presentes
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_WHATSAPP_URL
        value: https://api.whatsapp.com/message/S4EFURZFTKSAA1?autoload=1&app_absent=0&utm_source=ig
      - key: VITE_INSTAGRAM_URL
        value: https://www.instagram.com/mimoo_presentes/
